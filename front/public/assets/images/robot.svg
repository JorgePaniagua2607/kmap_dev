<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" width="280" height="300" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0eafc" />
      <stop offset="100%" stop-color="#cfdef3" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
    <linearGradient id="screenCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3c72" />
      <stop offset="100%" stop-color="#0f2027" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <linearGradient id="tabletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111e38" />
      <stop offset="100%" stop-color="#081020" />
    </linearGradient>

    <!-- Shadow & Glow filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="robotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#robotShadow)">
    <!-- Base Shadow beneath feet -->
    <ellipse cx="140" cy="285" rx="75" ry="12" fill="#001833" opacity="0.6" filter="url(#softGlow)" />

    <!-- Legs & Feet -->
    <g>
      <!-- Left Leg -->
      <rect x="105" y="220" width="22" height="35" rx="10" fill="url(#bodyGrad)" stroke="#b0c4de" stroke-width="1.5"/>
      <rect x="107" y="238" width="18" height="6" rx="3" fill="url(#cyanAccent)"/>
      <ellipse cx="116" cy="258" rx="17" ry="9" fill="url(#bodyGrad)" stroke="#b0c4de" stroke-width="1.5"/>
      <path d="M 103 260 C 103 260 116 265 129 260" stroke="#00d2ff" stroke-width="3" stroke-linecap="round"/>

      <!-- Right Leg -->
      <rect x="153" y="220" width="22" height="35" rx="10" fill="url(#bodyGrad)" stroke="#b0c4de" stroke-width="1.5"/>
      <rect x="155" y="238" width="18" height="6" rx="3" fill="url(#cyanAccent)"/>
      <ellipse cx="164" cy="258" rx="17" ry="9" fill="url(#bodyGrad)" stroke="#b0c4de" stroke-width="1.5"/>
      <path d="M 151 260 C 151 260 164 265 177 260" stroke="#00d2ff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Torso -->
    <g id="torso">
      <path d="M 98 145 C 98 135 182 135 182 145 L 180 220 C 180 228 100 228 100 220 Z" fill="url(#bodyGrad)" stroke="#cfdef3" stroke-width="2"/>
      <!-- Chest Cyan Glowing Plate -->
      <rect x="115" y="152" width="50" height="24" rx="8" fill="#0a192f" stroke="#00d2ff" stroke-width="1.5"/>
      <line x1="125" y1="164" x2="155" y2="164" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
      <circle cx="120" cy="164" r="2" fill="#38ef7d"/>
      <circle cx="160" cy="164" r="2" fill="#00d2ff"/>
    </g>

    <!-- Arms -->
    <g id="arms">
      <!-- Left Arm (Holding Tablet) -->
      <path d="M 98 150 C 75 160 70 190 95 210" fill="none" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round"/>
      <circle cx="80" cy="180" r="10" fill="url(#cyanAccent)"/>
      <circle cx="95" cy="210" r="10" fill="url(#bodyGrad)"/>

      <!-- Right Arm (Holding Tablet) -->
      <path d="M 182 150 C 205 160 210 190 185 210" fill="none" stroke="url(#bodyGrad)" stroke-width="18" stroke-linecap="round"/>
      <circle cx="200" cy="180" r="10" fill="url(#cyanAccent)"/>
      <circle cx="185" cy="210" r="10" fill="url(#bodyGrad)"/>
    </g>

    <!-- Tablet in hands -->
    <g id="tablet" transform="translate(10, 0)">
      <rect x="75" y="185" width="110" height="75" rx="8" fill="url(#tabletGrad)" stroke="#00e5ff" stroke-width="2" filter="url(#softGlow)"/>
      <!-- Inner screen -->
      <rect x="80" y="190" width="100" height="65" rx="5" fill="#040d1a"/>
      <!-- Logo on tablet screen -->
      <g transform="translate(115, 205) scale(0.55)">
        <path d="M 28 48 C 18 44, 8 45, 2 48 L 2 18 C 8 15, 18 14, 28 18 Z" fill="#00f2fe" filter="url(#softGlow)"/>
        <path d="M 32 48 C 42 44, 52 45, 58 48 L 58 18 C 52 15, 42 14, 32 18 Z" fill="#00f2fe" filter="url(#softGlow)"/>
        <rect x="44" y="6" width="6" height="6" rx="1.5" fill="#38ef7d"/>
        <rect x="52" y="12" width="5" height="5" rx="1" fill="#00f2fe"/>
      </g>
      <!-- Tablet hands gripping edges -->
      <ellipse cx="78" cy="225" rx="7" ry="11" fill="url(#bodyGrad)" stroke="#b0c4de"/>
      <ellipse cx="182" cy="225" rx="7" ry="11" fill="url(#bodyGrad)" stroke="#b0c4de"/>
    </g>

    <!-- Robot Head -->
    <g id="head">
      <!-- Head Base -->
      <rect x="85" y="55" width="110" height="90" rx="35" fill="url(#bodyGrad)" stroke="#ffffff" stroke-width="2"/>
      
      <!-- Cyan Ear Pads -->
      <ellipse cx="84" cy="100" rx="9" ry="18" fill="url(#cyanAccent)" filter="url(#softGlow)"/>
      <ellipse cx="196" cy="100" rx="9" ry="18" fill="url(#cyanAccent)" filter="url(#softGlow)"/>
      <circle cx="84" cy="100" r="5" fill="#ffffff" opacity="0.8"/>
      <circle cx="196" cy="100" r="5" fill="#ffffff" opacity="0.8"/>

      <!-- Dark Face Glass Visor -->
      <rect x="94" y="68" width="92" height="64" rx="22" fill="url(#visorGrad)" stroke="#00e5ff" stroke-width="2"/>

      <!-- Glowing Face Features (Friendly Cyan Eyes & Smile) -->
      <g filter="url(#softGlow)">
        <!-- Left eye (Happy arch) -->
        <path d="M 112 94 Q 121 82 130 94" fill="none" stroke="#00f2fe" stroke-width="4.5" stroke-linecap="round"/>
        <!-- Right eye (Happy arch) -->
        <path d="M 150 94 Q 159 82 168 94" fill="none" stroke="#00f2fe" stroke-width="4.5" stroke-linecap="round"/>
        
        <!-- Smile -->
        <path d="M 132 110 Q 140 118 148 110" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round"/>

        <!-- Soft cute blush dots -->
        <circle cx="108" cy="108" r="4" fill="#00d2ff" opacity="0.4"/>
        <circle cx="172" cy="108" r="4" fill="#00d2ff" opacity="0.4"/>
      </g>
    </g>

    <!-- Graduation Mortarboard Cap -->
    <g id="gradCap">
      <!-- Diamond cap top tilted nicely -->
      <path d="M 140 18 L 225 40 L 140 62 L 55 40 Z" fill="url(#capGrad)" stroke="#3a7bd5" stroke-width="2"/>
      <!-- Cap base skull band -->
      <path d="M 100 50 C 100 50 140 66 180 50 L 182 66 C 182 66 140 78 98 66 Z" fill="#0d1b2a"/>
      
      <!-- Golden Button in center -->
      <ellipse cx="140" cy="40" rx="6" ry="4" fill="url(#goldGrad)" filter="url(#softGlow)"/>

      <!-- Golden Tassel draping to the right -->
      <path d="M 140 40 Q 190 42 205 65 Q 212 85 210 100" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Tassel brush hanging at end -->
      <polygon points="206,98 214,98 216,115 204,115" fill="url(#goldGrad)"/>
      <circle cx="210" cy="98" r="3" fill="#ffe259"/>
    </g>
  </g>
</svg>
